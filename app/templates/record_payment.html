{% extends "layout.html" %}
{% block title %}Record Payment{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card stat-card">
            <div class="card-header bg-white">
                <h5 class="mb-0 fw-bold"><i class="bi bi-cash-coin"></i> Record Payment</h5>
            </div>
            <div class="card-body">
                {% if current_user.role == 'collector' %}
                <!-- Search functionality for collectors -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Search Student</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="studentSearch" class="form-control" placeholder="Search by student name or ID...">
                        <button type="button" id="searchBtn" class="btn btn-mt-green">Search</button>
                    </div>
                    <small class="text-muted">Type at least 2 characters to search</small>
                </div>
                
                <!-- Search Results -->
                <div id="searchResults" class="mb-4" style="display: none;">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm">
                            <thead class="table-light">
                                <tr>
                                    <th>Student ID</th>
                                    <th>Name</th>
                                    <th>Class</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="searchResultsBody">
                            </tbody>
                        </table>
                    </div>
                </div>
                {% endif %}
                
                <form method="POST" action="{{ url_for('payments.record_payment') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">
                        <!-- Class filter for quick student selection -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Filter by Class</label>
                            <select id="classFilter" class="form-select">
                                <option value="">All Classes</option>
                                {% for c in classes %}
                                <option value="{{ c.id }}">{{ c.class_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Student <span class="text-danger">*</span></label>
                            <select name="student_id" id="studentSelect" class="form-select" required>
                                <option value="">-- Select Student --</option>
                                {% for s in students %}
                                <option value="{{ s.id }}" data-class="{{ s.class_id or '' }}">{{ s.full_name }} ({{ s.student_id }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Amount (GH&#8373;)</label>
                            <input type="number" name="amount" class="form-control" value="{{ default_amount }}" step="0.01" min="0.01" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Payment Date</label>
                            <input type="date" name="payment_date" class="form-control" value="{{ today }}" required>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-mt-green btn-lg">
                            <i class="bi bi-check-circle"></i> Record Payment
                        </button>
                        <a href="{{ url_for('payments.list_payments') }}" class="btn btn-outline-secondary btn-lg ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Class filter for student dropdown
document.getElementById('classFilter').addEventListener('change', function() {
    const classId = this.value;
    const studentSelect = document.getElementById('studentSelect');
    const options = studentSelect.querySelectorAll('option');

    options.forEach(option => {
        if (!option.value) return; // Skip the placeholder
        if (!classId || option.dataset.class === classId) {
            option.style.display = '';
        } else {
            option.style.display = 'none';
        }
    });
    studentSelect.value = '';
});

// Student search for collectors
const searchInput = document.getElementById('studentSearch');
const searchBtn = document.getElementById('searchBtn');
const searchResults = document.getElementById('searchResults');
const searchResultsBody = document.getElementById('searchResultsBody');

function performSearch() {
    const query = searchInput.value.trim();
    if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
    }
    
    fetch(`/payments/search-students?q=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
            searchResultsBody.innerHTML = '';
            if (data.length === 0) {
                searchResultsBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No students found</td></tr>';
            } else {
                data.forEach(student => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><code>${student.student_id}</code></td>
                        <td class="fw-semibold">${student.full_name}</td>
                        <td>${student.class_name}</td>
                        <td>
                            <button type="button" class="btn btn-sm btn-mt-green" 
                                    onclick="selectStudent(${student.id}, '${student.full_name.replace(/'/g, "\\'")} (${student.student_id})')">
                                <i class="bi bi-check-circle"></i> Select
                            </button>
                        </td>
                    `;
                    searchResultsBody.appendChild(row);
                });
            }
            searchResults.style.display = 'block';
        })
        .catch(error => {
            console.error('Search error:', error);
            searchResults.style.display = 'none';
        });
}

function selectStudent(studentId, studentName) {
    const studentSelect = document.getElementById('studentSelect');
    studentSelect.value = studentId;
    searchResults.style.display = 'none';
    searchInput.value = '';
    
    // Show selected student in dropdown
    const options = studentSelect.querySelectorAll('option');
    options.forEach(option => {
        if (option.value == studentId) {
            option.selected = true;
        }
    });
}

if (searchBtn) {
    searchBtn.addEventListener('click', performSearch);
}

if (searchInput) {
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            performSearch();
        }
    });
    
    // Live search with debounce
    let debounceTimer;
    searchInput.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(performSearch, 300);
    });
}
</script>
{% endblock %}
