{% extends "layout.html" %}
{% block title %}Edit School{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card stat-card">
            <div class="card-header bg-white">
                <h5 class="mb-0 fw-bold"><i class="bi bi-pencil"></i> Edit School</h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">School Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" value="{{ school.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ school.address or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">School Logo</label>
                        {% if school.logo_path %}
                        <div class="mb-2">
                            <img src="{{ url_for('static', filename=school.logo_path) }}" alt="Current Logo" style="max-height:60px;">
                            <span class="text-muted small ms-2">Current logo</span>
                        </div>
                        {% endif %}
                        <input type="file" name="logo" class="form-control" accept="image/*">
                        <div class="form-text">PNG, JPG, GIF, WEBP. Max 5MB. Leave empty to keep current logo.</div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-mt-green">Update School</button>
                        <a href="{{ url_for('schools.list_schools') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
