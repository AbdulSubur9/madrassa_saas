{% extends "layout.html" %}
{% block title %}Create School{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card stat-card">
            <div class="card-header bg-white">
                <h5 class="mb-0 fw-bold"><i class="bi bi-building-add"></i> Create School</h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">School Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" placeholder="Enter school name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Address</label>
                        <textarea name="address" class="form-control" rows="2" placeholder="School address (optional)"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">School Logo</label>
                        <input type="file" name="logo" class="form-control" accept="image/*">
                        <div class="form-text">PNG, JPG, GIF, WEBP. Max 5MB. Optional.</div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-mt-green">Create School</button>
                        <a href="{{ url_for('schools.list_schools') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
